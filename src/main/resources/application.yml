spring:
  application:
    name: wallet-ledger-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_ledger}
    username: ${DB_USERNAME:walletuser}
    password: ${DB_PASSWORD:walletpass123}
    hikari:
      # A money movement holds its connection for as long as it holds the row lock, so this
      # pool size is the real ceiling on concurrent movements. Raise it alongside the
      # database's max_connections, not past it.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities still match it, so a
      # drifted mapping fails at startup rather than at the first query.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: 10
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP_ID:wallet-ledger-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ledger.wallet.*
    listener:
      ack-mode: MANUAL
      concurrency: 3

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # Not env or configprops: those expose credentials on an unauthenticated port.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  idempotency:
    # How long a stored outcome stays replayable. Clients give up long before this.
    ttl: 24h
    max-key-length: 255
    purge-cron: "0 0 * * * *"
  wallet:
    default-currency: INR
    # Must stay in step with the check constraint on wallets.currency.
    supported-currencies: INR,USD,EUR,GBP
    default-type: PRIMARY

logging:
  level:
    root: INFO
    com.ledger.wallet: INFO
