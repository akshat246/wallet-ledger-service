spring:
  application:
    name: wallet-ledger-service
    version: 1.0.0

  # Data Source Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_ledger
    username: walletuser
    password: walletpass123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages migrations
      use-new-id-generator-mappings: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
        format_sql: true
    show-sql: false
    open-in-view: false

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all  # Wait for all replicas
      retries: 3
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: 10  # Batch messages for better throughput
        batch.size: 32768
    consumer:
      group-id: wallet-service-consumer-group
      auto-offset-reset: earliest
      max-poll-records: 500
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: MANUAL
      concurrency: 3

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # JMX Configuration
  jmx:
    enabled: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always

# Actuator & Monitoring Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,2s
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.natwest.wallet: DEBUG
    org.springframework.boot: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/wallet-ledger-service.log
    max-size: 10MB
    max-history: 10

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        recordExceptions:
          - com.natwest.wallet.exception.TransactionException
    instances:
      transactionBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        intervalFunction: exponentialRandom
        retryExceptions:
          - com.natwest.wallet.exception.TransactionException
    instances:
      transactionRetry:
        baseConfig: default
        maxAttempts: 2

  timelimiter:
    configs:
      default:
        cancelRunningFuture: true
        timeoutDuration: 3s
    instances:
      transactionLimiter:
        baseConfig: default

# Application Custom Properties
app:
  name: wallet-ledger-service
  version: 1.0.0
  description: Distributed Payment & Wallet Ledger Service
  cache:
    idempotency:
      ttl-hours: 24
    wallet:
      ttl-minutes: 5
  transaction:
    max-retries: 3
    timeout-seconds: 30
  kafka:
    topics:
      transactions: transaction-events
      notifications: notification-events
      dlq: transaction-events-dlq
