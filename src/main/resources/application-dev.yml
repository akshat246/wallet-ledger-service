# Local development only. SQL logging prints bound parameters, which here means account
# identifiers and amounts in plain text, so it must never be enabled where real data lives.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ledger.wallet: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  file:
    name: logs/wallet-ledger-service.log

management:
  endpoint:
    health:
      show-details: always
